name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: visitspakistan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U platform -d visitspakistan_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NX_DAEMON: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: platform
      DB_PASS: ci-only-password
      DB_NAME: visitspakistan
      DB_TEST_NAME: visitspakistan_test
      REDIS_URL: redis://localhost:6379
      OPENSEARCH_URL: http://localhost:9200
      WEB_ORIGIN: http://localhost:3000
      CMS_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm infra:up
      - run: pnpm db:migrate:test
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: |
          for attempt in $(seq 1 60); do
            if docker compose ps | grep -q 'unhealthy'; then docker compose logs; exit 1; fi
            if curl -fsS http://localhost:9200/_cluster/health >/dev/null; then break; fi
            sleep 2
          done
          pnpm test:integration
      - run: pnpm build
